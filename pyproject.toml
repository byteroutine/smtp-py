[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bytesmtp"
dynamic = ["version"]
description = "Send email from Python in one line. A tiny batteries-included SMTP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Byte Routine" }]
keywords = ["smtp", "email", "mailer", "transactional-email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "typer>=0.12,<0.20",
    "rich>=13.7,<15.0",
    "httpx>=0.27,<0.29",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
smtp-py = "smtppy.cli:cli"

[tool.setuptools.packages.find]
include = ["smtppy*"]

[tool.setuptools.dynamic]
version = { attr = "smtppy._version.__version__" }
